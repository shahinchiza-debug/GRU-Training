<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <style>
    .title { font: 700 30px 'Segoe UI', sans-serif; fill: #172033; }
    .subtitle { font: 400 17px 'Segoe UI', sans-serif; fill: #516075; }
    .label { font: 700 16px 'Segoe UI', sans-serif; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
    .small { font: 400 14px 'Segoe UI', sans-serif; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
    .tiny { font: 400 13px 'Segoe UI', sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 12; }
    .state { fill: #eaf2ff; stroke: #3974bc; stroke-width: 2.5; rx: 12; }
    .count { fill: #fff5dc; stroke: #d69e2e; stroke-width: 2.5; rx: 12; }
    .signal { fill: #f4efff; stroke: #805ad5; stroke-width: 2.5; rx: 12; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    .line { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
  </style>

  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="70" y="62" class="title">P1: öppningshierarki</text>
  <text x="70" y="92" class="subtitle">P1 startar samtalet. Ett intent kan nämnas direkt, men P1 skapar aldrig ett intent_id eller ett objekt.</text>

  <rect x="710" y="125" width="180" height="58" class="box"/>
  <text x="800" y="154" class="label">P1</text>
  <path d="M800 183 V215 H235 V245 M800 215 H610 V245 M800 215 H990 V245 M800 215 H1365 V245" class="line"/>

  <rect x="105" y="245" width="260" height="72" class="state"/>
  <text x="235" y="267" class="label">State: P1.1</text>
  <text x="235" y="289" class="small">AI öppnar, inget intent direkt</text>
  <rect x="480" y="245" width="260" height="72" class="state"/>
  <text x="610" y="267" class="label">State: P1.2</text>
  <text x="610" y="289" class="small">AI öppnar, intent direkt</text>
  <rect x="860" y="245" width="260" height="72" class="state"/>
  <text x="990" y="267" class="label">State: P1.3</text>
  <text x="990" y="289" class="small">Kund öppnar utan intent</text>
  <rect x="1235" y="245" width="260" height="72" class="state"/>
  <text x="1365" y="267" class="label">State: P1.4</text>
  <text x="1365" y="289" class="small">Kund öppnar med intent direkt</text>

  <path d="M235 317 V350 H800 M610 317 V350 H800 M990 317 V350 H800 M1365 317 V350 H800" class="line"/>
  <rect x="680" y="350" width="240" height="60" class="count"/>
  <text x="800" y="379" class="label">intent_count: 0</text>
  <path d="M800 410 V455" class="line"/>

  <rect x="570" y="455" width="460" height="70" class="note"/>
  <text x="800" y="479" class="label">Ingen MLP-hierarki och inga ID:n i P1</text>
  <text x="800" y="502" class="small">P1 skapar inte BOOK_001, SVC_ID eller AUTH_001.</text>

  <path d="M610 317 V570 M1365 317 V570" class="dash"/>
  <rect x="425" y="570" width="370" height="72" class="signal"/>
  <text x="610" y="594" class="label">P1.2: öppningssignal</text>
  <text x="610" y="617" class="small">Intent nämns, men byggs i P2.</text>
  <rect x="1175" y="570" width="370" height="72" class="signal"/>
  <text x="1360" y="594" class="label">P1.4: öppningssignal</text>
  <text x="1360" y="617" class="small">Intent nämns, men byggs i P2.</text>

  <path d="M610 642 V700 H800 M1360 642 V700 H800" class="dash"/>
  <rect x="610" y="700" width="380" height="70" class="note"/>
  <text x="800" y="724" class="label">Överlämning till P2</text>
  <text x="800" y="747" class="small">P2 väljer MLP1, MLP2, skapar ID:n och fyller parametrar.</text>

  <rect x="180" y="860" width="1240" height="122" class="note"/>
  <text x="800" y="890" class="label">P1-regler</text>
  <text x="800" y="918" class="small">P1.1 och P1.3: ingen konkret handling uttrycks ännu.</text>
  <text x="800" y="943" class="small">P1.2 och P1.4: kunden kan nämna exempelvis “jag vill boka”, men detta är en dialogsignal och inte ett skapat Booking-intent.</text>
  <text x="800" y="968" class="small">Alla fyra P1-states lämnar sessionsminnet utan nya objekt.</text>
</svg>
