<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1260" viewBox="0 0 1900 1260">
  <style>
    .title { font: 700 32px 'Segoe UI', sans-serif; fill: #172033; }
    .subtitle { font: 400 17px 'Segoe UI', sans-serif; fill: #516075; }
    .heading { font: 700 19px 'Segoe UI', sans-serif; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
    .label { font: 700 15px 'Segoe UI', sans-serif; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
    .small { font: 400 13px 'Segoe UI', sans-serif; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
    .tiny { font: 400 12px 'Segoe UI', sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
    .root { fill: #ffffff; stroke: #64748b; stroke-width: 2.5; rx: 12; }
    .d { fill: #eaf2ff; stroke: #3974bc; stroke-width: 2.5; rx: 12; }
    .mlp { fill: #f4efff; stroke: #805ad5; stroke-width: 2.5; rx: 12; }
    .pool { fill: #e8f8ef; stroke: #2f855a; stroke-width: 2.5; rx: 12; }
    .action { fill: #fff5dc; stroke: #d69e2e; stroke-width: 2.5; rx: 12; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    .line { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
  </style>
  <rect width="1900" height="1260" fill="#f8fafc"/>
  <text x="75" y="62" class="title">D-noder: gemensam översikt</text>
  <text x="75" y="93" class="subtitle">D1, D2, D3 och D5. D4 är medvetet exkluderad. Alla D-noder placeras i flowet men läser och uppdaterar bara sessionsläget enligt sin egen regel.</text>

  <rect x="835" y="130" width="230" height="62" class="root"/>
  <text x="950" y="161" class="heading">D-avvikelse</text>
  <path d="M950 192 V230 H260 V270 M950 230 H720 V270 M950 230 H1180 V270 M950 230 H1640 V270" class="line"/>

  <!-- D1 -->
  <rect x="130" y="270" width="260" height="64" class="d"/>
  <text x="260" y="294" class="heading">D1: FAQ</text><text x="260" y="316" class="small">Ändrar inget</text>
  <path d="M260 334 V375" class="line"/>
  <rect x="130" y="375" width="260" height="56" class="mlp"/><text x="260" y="403" class="label">MLP1: FAQ</text>
  <path d="M260 431 V470 H155 V500 M260 470 H365 V500" class="line"/>
  <rect x="60" y="500" width="190" height="56" class="pool"/><text x="155" y="528" class="label">general-pool</text>
  <rect x="270" y="500" width="190" height="56" class="pool"/><text x="365" y="528" class="label">referens-pool</text>
  <path d="M155 556 V590 M365 556 V590" class="dash"/>
  <rect x="55" y="590" width="200" height="60" class="note"/><text x="155" y="615" class="small">Inget target_id</text><text x="155" y="636" class="tiny">Fristående FAQ</text>
  <rect x="265" y="590" width="200" height="60" class="note"/><text x="365" y="612" class="small">reference_id</text><text x="365" y="633" class="tiny">BOOK / SVC / AUTH</text>

  <!-- D2 -->
  <rect x="590" y="270" width="260" height="64" class="d"/>
  <text x="720" y="294" class="heading">D2: en korrigering</text><text x="720" y="316" class="small">Ett tidigare intent</text>
  <path d="M720 334 V375" class="line"/>
  <rect x="590" y="375" width="260" height="56" class="action"/><text x="720" y="403" class="label">Exakt ett target_id</text>
  <path d="M720 431 V470 H580 V500 M720 470 V500 M720 470 H860 V500" class="line"/>
  <rect x="490" y="500" width="180" height="56" class="mlp"/><text x="580" y="528" class="label">Booking</text>
  <rect x="630" y="500" width="180" height="56" class="mlp"/><text x="720" y="528" class="label">Tjänster</text>
  <rect x="810" y="500" width="180" height="56" class="mlp"/><text x="900" y="528" class="label">Auth</text>
  <path d="M580 556 V590 M720 556 V590 M900 556 V590" class="dash"/>
  <rect x="490" y="590" width="180" height="60" class="note"/><text x="580" y="612" class="small">ändra / omboka</text><text x="580" y="633" class="tiny">BOOK_001</text>
  <rect x="630" y="590" width="180" height="60" class="note"/><text x="720" y="612" class="small">byta ut</text><text x="720" y="633" class="tiny">SVC_00X</text>
  <rect x="810" y="590" width="180" height="60" class="note"/><text x="900" y="612" class="small">ändra</text><text x="900" y="633" class="tiny">AUTH_001</text>

  <!-- D3 -->
  <rect x="1050" y="270" width="260" height="64" class="d"/>
  <text x="1180" y="294" class="heading">D3: ny tjänst</text><text x="1180" y="316" class="small">Skapar ett nytt objekt</text>
  <path d="M1180 334 V375" class="line"/>
  <rect x="1050" y="375" width="260" height="56" class="mlp"/><text x="1180" y="403" class="label">MLP1: Tjänster</text>
  <path d="M1180 431 V470" class="line"/>
  <rect x="1050" y="470" width="260" height="56" class="mlp"/><text x="1180" y="498" class="label">MLP2: lägga till</text>
  <path d="M1180 526 V565" class="line"/>
  <rect x="1050" y="565" width="260" height="60" class="pool"/><text x="1180" y="590" class="label">Nytt SVC_00X</text><text x="1180" y="611" class="tiny">unik tjänst från tjänstepoolen</text>
  <path d="M1180 625 V660" class="dash"/>
  <rect x="1050" y="660" width="260" height="60" class="note"/><text x="1180" y="685" class="small">Läggs i active_services</text><text x="1180" y="706" class="tiny">använder aldrig target_id</text>

  <!-- D5 -->
  <rect x="1510" y="270" width="260" height="64" class="d"/>
  <text x="1640" y="294" class="heading">D5: flera korrigeringar</text><text x="1640" y="316" class="small">Två eller fler intents</text>
  <path d="M1640 334 V375" class="line"/>
  <rect x="1510" y="375" width="260" height="56" class="action"/><text x="1640" y="403" class="label">2+ olika target_id</text>
  <path d="M1640 431 V470" class="line"/>
  <rect x="1510" y="470" width="260" height="72" class="note"/>
  <text x="1640" y="494" class="label">Upprepa D2-trädet</text><text x="1640" y="517" class="small">en gång per target_id</text>
  <path d="M1640 542 V580" class="dash"/>
  <rect x="1510" y="580" width="260" height="72" class="note"/>
  <text x="1640" y="604" class="small">Varje target kan få</text><text x="1640" y="625" class="small">flera fält korrigerade.</text>

  <rect x="160" y="820" width="1580" height="250" class="note"/>
  <text x="950" y="854" class="heading">Skillnaden mellan D-noderna</text>
  <text x="950" y="890" class="small">D1 frågar men ändrar inget. D2 ändrar exakt ett tidigare intent. D3 skapar en ny unik tjänst.</text>
  <text x="950" y="920" class="small">D5 använder samma korrigeringsregler som D2, men måste träffa två eller fler olika tidigare intents med olika target_id:n.</text>
  <text x="950" y="960" class="small">Alla korrigeringsgrenar filtreras före val: en gren utan ett giltigt target får inte skapas. D3 väljer alltid tjänst från poolen minus active_services.</text>
  <text x="950" y="1000" class="small">D4 ingår inte i denna version.</text>
</svg>
