<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <style>
    .title { font: 700 30px 'Segoe UI', sans-serif; fill: #172033; }
    .subtitle { font: 400 17px 'Segoe UI', sans-serif; fill: #516075; }
    .label { font: 700 16px 'Segoe UI', sans-serif; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
    .small { font: 400 14px 'Segoe UI', sans-serif; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
    .tiny { font: 400 13px 'Segoe UI', sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 12; }
    .state { fill: #eaf2ff; stroke: #3974bc; stroke-width: 2.5; rx: 12; }
    .count { fill: #fff5dc; stroke: #d69e2e; stroke-width: 2.5; rx: 12; }
    .mlp { fill: #f4efff; stroke: #805ad5; stroke-width: 2.5; rx: 12; }
    .target { fill: #e8f8ef; stroke: #2f855a; stroke-width: 2.5; rx: 12; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    .line { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
  </style>

  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="70" y="62" class="title">P4: korrigeringshierarki</text>
  <text x="70" y="92" class="subtitle">State låser antal korrigeringar. Varje korrigering väljer sedan en giltig gren och ett tidigare skapat target_id.</text>

  <!-- State selection -->
  <rect x="710" y="125" width="180" height="58" class="box"/>
  <text x="800" y="154" class="label">P4</text>

  <path d="M800 183 V215 H310 V245 M800 215 V245 M800 215 H1290 V245" class="line"/>

  <rect x="200" y="245" width="220" height="64" class="state"/>
  <text x="310" y="268" class="label">State: P4.1</text>
  <text x="310" y="289" class="small">Ingen korrigering</text>

  <rect x="690" y="245" width="220" height="64" class="state"/>
  <text x="800" y="268" class="label">State: P4.2</text>
  <text x="800" y="289" class="small">En korrigering</text>

  <rect x="1180" y="245" width="220" height="64" class="state"/>
  <text x="1290" y="268" class="label">State: P4.3</text>
  <text x="1290" y="289" class="small">Flera korrigeringar</text>

  <path d="M310 309 V346 M800 309 V346 M1290 309 V346" class="line"/>

  <rect x="200" y="346" width="220" height="58" class="count"/>
  <text x="310" y="375" class="label">target_count: 0</text>
  <path d="M310 404 V447" class="line"/>
  <rect x="174" y="447" width="272" height="58" class="note"/>
  <text x="310" y="476" class="small">Inga intents eller targets</text>

  <rect x="680" y="346" width="240" height="58" class="count"/>
  <text x="800" y="375" class="label">target_count: 1</text>

  <rect x="1160" y="346" width="260" height="58" class="count"/>
  <text x="1290" y="375" class="label">target_count: 2-4</text>

  <path d="M800 404 V447 H800 M1290 404 V447 H800" class="line"/>
  <rect x="620" y="447" width="360" height="64" class="note"/>
  <text x="800" y="470" class="label">Korrigeringsslot</text>
  <text x="800" y="491" class="small">P4.2 kör den 1 gång. P4.3 upprepar den 2-4 gånger.</text>
  <path d="M800 511 V555" class="line"/>

  <!-- MLP1 -->
  <path d="M800 555 H310 V590 M800 555 V590 M800 555 H1290 V590" class="line"/>
  <rect x="185" y="590" width="250" height="60" class="mlp"/>
  <text x="310" y="620" class="label">MLP1: Booking</text>
  <rect x="675" y="590" width="250" height="60" class="mlp"/>
  <text x="800" y="620" class="label">MLP1: Tjänster</text>
  <rect x="1165" y="590" width="250" height="60" class="mlp"/>
  <text x="1290" y="620" class="label">MLP1: Auth</text>

  <!-- Booking branch -->
  <path d="M310 650 V682 H205 V710 M310 682 H415 V710" class="line"/>
  <rect x="105" y="710" width="200" height="58" class="mlp"/>
  <text x="205" y="739" class="label">MLP2: ändra</text>
  <rect x="315" y="710" width="200" height="58" class="mlp"/>
  <text x="415" y="739" class="label">MLP2: omboka</text>
  <path d="M205 768 V800 H310 V830 M415 768 V800 H310" class="line"/>
  <rect x="190" y="830" width="240" height="60" class="target"/>
  <text x="310" y="853" class="label">target_id: BOOK_001</text>
  <text x="310" y="875" class="tiny">från active_booking</text>
  <path d="M205 890 V916 M415 890 V916" class="dash"/>
  <text x="205" y="936" class="tiny">ändra: valfritt bokningsfält</text>
  <text x="415" y="936" class="tiny">omboka: day, time eller staff</text>

  <!-- Service branch -->
  <path d="M800 650 V710" class="line"/>
  <rect x="700" y="710" width="200" height="58" class="mlp"/>
  <text x="800" y="739" class="label">MLP2: byta ut</text>
  <path d="M800 768 V830" class="line"/>
  <rect x="680" y="830" width="240" height="60" class="target"/>
  <text x="800" y="853" class="label">target_id: SVC_00X</text>
  <text x="800" y="875" class="tiny">väljs från active_services</text>
  <path d="M800 890 V916" class="dash"/>
  <text x="800" y="936" class="tiny">ny unik tjänst från poolen</text>

  <!-- Auth branch -->
  <path d="M1290 650 V710" class="line"/>
  <rect x="1190" y="710" width="200" height="58" class="mlp"/>
  <text x="1290" y="739" class="label">MLP2: ändra</text>
  <path d="M1290 768 V830" class="line"/>
  <rect x="1170" y="830" width="240" height="60" class="target"/>
  <text x="1290" y="853" class="label">target_id: AUTH_001</text>
  <text x="1290" y="875" class="tiny">från active_auth</text>
  <path d="M1290 890 V916" class="dash"/>
  <text x="1290" y="936" class="tiny">fält att ändra: namn eller telefon</text>

  <!-- Rule panel -->
  <rect x="180" y="1000" width="1240" height="78" class="note"/>
  <text x="800" y="1028" class="label">Regel per korrigeringsslot</text>
  <text x="800" y="1055" class="small">Välj endast en gren med minst ett giltigt target. Exkludera targets som redan används i samma P4-block. Uppdatera active-listorna direkt efter ändringen.</text>
</svg>
