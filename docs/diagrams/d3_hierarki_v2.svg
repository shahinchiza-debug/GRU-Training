<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <style>
    .title { font: 700 30px 'Segoe UI', sans-serif; fill: #172033; }
    .subtitle { font: 400 17px 'Segoe UI', sans-serif; fill: #516075; }
    .label { font: 700 16px 'Segoe UI', sans-serif; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
    .small { font: 400 14px 'Segoe UI', sans-serif; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
    .tiny { font: 400 13px 'Segoe UI', sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 12; }
    .state { fill: #eaf2ff; stroke: #3974bc; stroke-width: 2.5; rx: 12; }
    .count { fill: #fff5dc; stroke: #d69e2e; stroke-width: 2.5; rx: 12; }
    .mlp { fill: #f4efff; stroke: #805ad5; stroke-width: 2.5; rx: 12; }
    .created { fill: #e8f8ef; stroke: #2f855a; stroke-width: 2.5; rx: 12; }
    .effect { fill: #ffffff; stroke: #38a169; stroke-width: 2; rx: 22; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    .line { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
  </style>

  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="70" y="62" class="title">D3: ny tjänst-hierarki</text>
  <text x="70" y="92" class="subtitle">D3 lägger till en ny tjänst i en redan befintlig bokning eller förfrågan. Den använder inte target_id.</text>

  <rect x="710" y="125" width="180" height="58" class="box"/>
  <text x="800" y="154" class="label">D3</text>
  <path d="M800 183 V235" class="line"/>
  <rect x="690" y="235" width="220" height="58" class="state"/>
  <text x="800" y="264" class="label">State: D3</text>
  <path d="M800 293 V340" class="line"/>
  <rect x="680" y="340" width="240" height="58" class="count"/>
  <text x="800" y="369" class="label">intent_count: 1</text>
  <path d="M800 398 V445" class="line"/>

  <rect x="675" y="445" width="250" height="60" class="mlp"/>
  <text x="800" y="475" class="label">MLP1: Tjänster</text>
  <path d="M800 505 V550" class="line"/>
  <rect x="675" y="550" width="250" height="60" class="mlp"/>
  <text x="800" y="580" class="label">MLP2: lägga till</text>
  <path d="M800 610 V665" class="line"/>

  <rect x="665" y="665" width="270" height="66" class="created"/>
  <text x="800" y="690" class="label">intent_id: SVC_00X</text>
  <text x="800" y="713" class="tiny">nästa lediga SVC_ID skapas</text>
  <path d="M800 731 V770" class="dash"/>

  <rect x="615" y="770" width="370" height="68" class="note"/>
  <text x="800" y="794" class="label">Välj service från tjänstepoolen</text>
  <text x="800" y="817" class="small">tjänstepool minus active_services</text>
  <path d="M800 838 V875" class="line"/>

  <rect x="605" y="875" width="390" height="60" class="effect"/>
  <text x="800" y="898" class="label">Ny unik tjänst läggs till</text>
  <text x="800" y="920" class="small">SVC_00X läggs i active_services</text>

  <rect x="180" y="990" width="1240" height="78" class="note"/>
  <text x="800" y="1018" class="label">D3-regler</text>
  <text x="800" y="1045" class="small">D3 får bara väljas när en bokning eller förfrågan redan finns. Den nya tjänsten får inte redan finnas i active_services och D3 har aldrig target_id.</text>
</svg>
