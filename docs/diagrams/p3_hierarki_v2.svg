<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <style>
    .title { font: 700 30px 'Segoe UI', sans-serif; fill: #172033; }
    .subtitle { font: 400 17px 'Segoe UI', sans-serif; fill: #516075; }
    .label { font: 700 16px 'Segoe UI', sans-serif; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
    .small { font: 400 14px 'Segoe UI', sans-serif; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
    .tiny { font: 400 13px 'Segoe UI', sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 12; }
    .state { fill: #eaf2ff; stroke: #3974bc; stroke-width: 2.5; rx: 12; }
    .count { fill: #fff5dc; stroke: #d69e2e; stroke-width: 2.5; rx: 12; }
    .mlp { fill: #f4efff; stroke: #805ad5; stroke-width: 2.5; rx: 12; }
    .created { fill: #e8f8ef; stroke: #2f855a; stroke-width: 2.5; rx: 12; }
    .effect { fill: #ffffff; stroke: #38a169; stroke-width: 2; rx: 22; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    .line { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
  </style>

  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="70" y="62" class="title">P3: auth-hierarki</text>
  <text x="70" y="92" class="subtitle">P3 samlar in kontaktuppgifter. State styr hur uppgifterna kommer fram, men alla states skapar samma auth-objekt.</text>

  <rect x="710" y="125" width="180" height="58" class="box"/>
  <text x="800" y="154" class="label">P3</text>
  <path d="M800 183 V215 H310 V245 M800 215 V245 M800 215 H1290 V245" class="line"/>

  <rect x="190" y="245" width="240" height="72" class="state"/>
  <text x="310" y="267" class="label">State: P3.1</text>
  <text x="310" y="289" class="small">Kontaktinfo utan problem</text>
  <rect x="680" y="245" width="240" height="72" class="state"/>
  <text x="800" y="267" class="label">State: P3.2</text>
  <text x="800" y="289" class="small">Kontaktinfo delvis</text>
  <rect x="1170" y="245" width="240" height="72" class="state"/>
  <text x="1290" y="267" class="label">State: P3.3</text>
  <text x="1290" y="289" class="small">Kontaktinfo oklar</text>

  <path d="M310 317 V350 H800 M800 317 V350 M1290 317 V350 H800" class="line"/>
  <rect x="680" y="350" width="240" height="60" class="count"/>
  <text x="800" y="379" class="label">intent_count: 1</text>
  <path d="M800 410 V455" class="line"/>

  <rect x="675" y="455" width="250" height="60" class="mlp"/>
  <text x="800" y="485" class="label">MLP1: Auth</text>
  <path d="M800 515 V560" class="line"/>
  <rect x="675" y="560" width="250" height="60" class="mlp"/>
  <text x="800" y="590" class="label">MLP2: skapa</text>
  <path d="M800 620 V680" class="line"/>

  <rect x="665" y="680" width="270" height="66" class="created"/>
  <text x="800" y="705" class="label">intent_id: AUTH_001</text>
  <text x="800" y="728" class="tiny">skapas en gång per mall</text>
  <path d="M800 746 V790" class="dash"/>

  <path d="M800 790 H565 V825 M800 790 H1035 V825" class="line"/>
  <rect x="460" y="825" width="210" height="60" class="effect"/>
  <text x="565" y="855" class="label">name</text>
  <rect x="930" y="825" width="210" height="60" class="effect"/>
  <text x="1035" y="855" class="label">phone</text>
  <path d="M565 885 V915 M1035 885 V915" class="dash"/>
  <rect x="405" y="915" width="320" height="52" class="note"/>
  <text x="565" y="941" class="small">väljs från namn-poolen</text>
  <rect x="875" y="915" width="320" height="52" class="note"/>
  <text x="1035" y="941" class="small">väljs från telefon-poolen</text>

  <rect x="180" y="1010" width="1240" height="78" class="note"/>
  <text x="800" y="1038" class="label">P3-regel</text>
  <text x="800" y="1065" class="small">Alla P3-states måste avslutas med både name och phone. AUTH_001 läggs i active_auth och kan därefter ändras av P4, D2 eller D5.</text>
</svg>
